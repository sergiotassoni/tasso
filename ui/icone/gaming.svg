<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<title>TASSO GAMING</title>
<style>
.look{animation:tlook 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pup{animation:tblink 7s infinite;transform-box:fill-box;transform-origin:center}
@keyframes tlook{0%,38%,100%{transform:translateX(0)}44%,54%{transform:translateX(-45%)}60%,70%{transform:translateX(45%)}76%{transform:translateX(0)}}
@keyframes tblink{0%,20%,24%,86%,90%,100%{transform:scaleY(1)}22%,88%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.look,.pup{animation:none}}
</style>
