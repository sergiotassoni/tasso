<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Tasso Setup</title>
<style>
/* Caratteri del sito di Tasso (Archivo, Onest, JetBrains Mono - SIL OFL 1.1), dentro la pagina: niente internet. */
/*CARATTERI*/
:root{
  --bg:#050506;--side:#08090B;--panel:#0B0C0F;--line:#1F2128;--text:#F4F5F7;--muted:#8A8F9C;
  --a1:#2FF3A6;--a2:#A97BFF;--a3:#4DA8FF;--a4:#FFB547;--ink:#03140C;--red:#FF6B5C;
  --display:'TassoArchivo','Bahnschrift','Segoe UI Variable Display','Segoe UI',sans-serif;
  --body:'TassoOnest','Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;
  --mono:'TassoMono','Cascadia Mono','Consolas',monospace;
  --soft:color-mix(in srgb,var(--text) 74%,var(--bg));
  --panel2:color-mix(in srgb,var(--panel) 92%,var(--text) 3%);
  --hover:color-mix(in srgb,var(--panel) 90%,var(--text) 5%);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,label:focus-within{outline:1px solid var(--a1);outline-offset:2px}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:18px;height:18px;flex:0 0 18px;margin:0;border:1px solid #3A3D47;border-radius:5px;background:transparent;cursor:pointer;display:grid;place-items:center;transition:background .15s,border-color .15s}
input[type=checkbox]::after{content:"";width:5px;height:9px;border:solid var(--ink);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg);opacity:0}
input[type=checkbox]:checked{background:var(--a1);border-color:var(--a1);box-shadow:0 0 10px color-mix(in srgb,var(--a1) 35%,transparent)}
input[type=checkbox]:checked::after{opacity:1}
input[type=checkbox]:disabled{cursor:default;opacity:.55;box-shadow:none}
.app{display:flex;height:100%}
/* barra a sinistra, come Tasso */
aside{width:212px;flex:0 0 212px;background:var(--side);border-right:1px solid var(--line);padding:22px 14px 20px;display:flex;flex-direction:column;gap:30px}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.brand img{width:40px;height:40px;flex:none}
.brand b{font-family:var(--display);font-weight:800;font-stretch:112%;font-size:19px;letter-spacing:.02em;display:block;line-height:1.1}
.brand small{display:inline-block;margin-top:4px;font:500 9.5px var(--mono);letter-spacing:.2em;color:var(--muted);text-transform:uppercase;border:1px solid var(--line);border-radius:5px;padding:2px 6px}
ol.passi{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
ol.passi li{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:9px;color:var(--muted);font-weight:500;font-size:13.5px}
ol.passi li i{font:500 10.5px var(--mono);letter-spacing:.08em;font-style:normal;width:24px;color:#565B67}
ol.passi li.on{background:var(--panel);color:var(--text);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
ol.passi li.on i{color:var(--a1)}
ol.passi li.fatto{color:var(--soft)}
ol.passi li.fatto i{color:var(--a1)}
.ver{margin-top:auto;padding:0 6px;font:500 10px var(--mono);letter-spacing:.2em;color:#565B67}
main{flex:1;min-width:0;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 100% 0%,color-mix(in srgb,var(--a2) 5%,transparent),transparent 60%)}
.pagina{display:none;flex:1;padding:22px 34px 8px;flex-direction:column;gap:14px;overflow-y:auto}
.pagina.on{display:flex}
.pagina::-webkit-scrollbar{width:10px}.pagina::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:3px solid var(--bg)}
/* scritta piccola in maiuscoletto spaziato, con la linea sotto come la Home di Tasso */
.k{font:500 10.5px var(--mono);letter-spacing:.22em;color:var(--muted);text-transform:uppercase;padding-bottom:13px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--a1);box-shadow:0 0 10px var(--a1);margin-right:12px;vertical-align:1px}
h1{margin:0;font-family:var(--display);font-weight:800;font-stretch:116%;letter-spacing:-.02em;font-size:29px;line-height:1.08;text-transform:uppercase}
h1::after{content:"";display:block;width:40px;height:3px;background:var(--a1);margin-top:12px}
h1:focus{outline:none}
.sub{color:var(--muted);margin:0;line-height:1.55;max-width:560px;font-size:13.5px}
/* il tasso grande della Home di Tasso */
.gmask{display:block;flex:none;width:64px;height:auto;overflow:visible}
.gmask .eye{filter:drop-shadow(0 0 8px color-mix(in srgb,var(--a1) 65%,transparent))}
.gmask .look{animation:tlook 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.gmask .eye{animation:gblink 6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes tlook{0%,62%,100%{transform:translateX(0)}68%,76%{transform:translateX(-45%)}82%,88%{transform:translateX(45%)}94%{transform:translateX(0)}}
@keyframes gblink{0%,30%,34%,94%,98%,100%{transform:scaleY(1)}32%,96%{transform:scaleY(.1)}}
.testa{display:flex;align-items:center;gap:24px}
.testa>div{min-width:0;display:flex;flex-direction:column;gap:12px}
.testa.big{gap:34px}
.testa.big .gmask{width:136px}
.testa.big h1{font-size:40px;letter-spacing:-.03em;font-stretch:122%}
.lingue{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:2px}
.lingue button{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:14.5px;font-weight:600;text-align:left;transition:border-color .15s,background .15s}
.lingue button span{font:500 10px var(--mono);letter-spacing:.18em;color:#565B67;text-transform:uppercase}
.lingue button:hover{background:var(--hover);border-color:#2C2F38}
.lingue button.on{border-color:color-mix(in srgb,var(--a1) 70%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 9%,var(--panel)),var(--panel) 70%)}
.lingue button.on span{color:var(--a1)}
.comp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.carta{display:flex;gap:13px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 13px;cursor:pointer;transition:border-color .15s,opacity .15s,background .15s}
.carta:hover{background:var(--hover)}
.carta.si{border-color:color-mix(in srgb,var(--a1) 38%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 6%,var(--panel)),var(--panel) 60%)}
.carta img{width:40px;height:40px;flex:0 0 40px}
.carta .t{flex:1;min-width:0}
.carta b{display:block;font-family:var(--display);font-weight:700;font-stretch:108%;font-size:15px}
.carta p{margin:3px 0 0;color:var(--muted);line-height:1.38;font-size:12px}
.carta .badge{display:inline-block;margin-top:6px;font:500 9.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--a2);border:1px solid color-mix(in srgb,var(--a2) 35%,var(--line));border-radius:5px;padding:2px 6px}
.nota{border:1px solid var(--line);border-left:2px solid var(--a2);border-radius:8px;padding:10px 14px;color:var(--soft);line-height:1.5;font-size:12.5px;white-space:pre-line;background:color-mix(in srgb,var(--panel) 60%,transparent)}
.nota.avviso{border-color:color-mix(in srgb,var(--a4) 40%,var(--line));border-left-color:var(--a4);color:var(--a4)}
.nota.errore{border-color:color-mix(in srgb,var(--red) 45%,var(--line));border-left-color:var(--red);color:var(--red)}
#errTesto{white-space:pre-line;overflow-wrap:anywhere}
.riga{display:flex;gap:10px;align-items:center}
input[type=text]{flex:1;min-width:0;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:500 13px var(--mono);user-select:text}
input[type=text]:focus{outline:none;border-color:color-mix(in srgb,var(--a1) 70%,var(--line))}
.percorsi{display:flex;flex-direction:column;border-block:1px solid var(--line)}
.percorsi div{display:flex;align-items:center;gap:12px;padding:8px 4px}
.percorsi div+div{border-top:1px solid var(--line)}
.percorsi img{width:24px;height:24px}
.percorsi b{width:120px;flex:0 0 120px;font-size:13px;font-weight:600}
.percorsi code{font:500 12px var(--mono);color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spazio{font:500 10.5px var(--mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
label.scelta{display:flex;gap:12px;align-items:center;color:var(--soft);cursor:pointer;font-size:13px;line-height:1.4}
#sceltaDati{font-size:12px;line-height:1.38;align-items:flex-start}
#sceltaDati input{margin-top:1px}
/* disinstalla: tutto in una schermata anche in tedesco */
#p6{padding-top:18px;gap:11px}#p6 .comp{gap:8px}#p6 .testa{gap:18px}#p6 .testa .gmask{width:50px}#p6 h1{font-size:24px}#p6 h1::after{margin-top:9px}#p6 .testa>div{gap:9px}#p6 .sub{font-size:12.5px;line-height:1.45}
#p6 .nota{padding:8px 12px;font-size:12px;line-height:1.42}#p6 .carta{padding:10px 12px}#p6 .carta p{line-height:1.33}#p6 .carta .badge{margin-top:5px}
label.scelta.fissa{cursor:default;opacity:.7}
/* installazione in corso */
.lavoro{display:flex;align-items:center;gap:40px;flex:1}
.lavoro .gmask{width:150px}
.lavoro>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.perc{font:800 72px/1 var(--display);font-stretch:122%;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.barra{position:relative;height:4px;border-radius:99px;background:#16181E;margin-top:4px}
.barra i{position:relative;display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--a1) 35%,transparent),var(--a1));transition:width .2s;box-shadow:0 0 14px color-mix(in srgb,var(--a1) 55%,transparent)}
.barra i::after{content:"";position:absolute;right:-3px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#EFFFF8;box-shadow:0 0 0 3px color-mix(in srgb,var(--a1) 30%,transparent),0 0 16px 4px color-mix(in srgb,var(--a1) 70%,transparent)}
.fase{color:var(--soft);font:500 11px var(--mono);letter-spacing:.08em;min-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apri{display:flex;flex-direction:column;border-block:1px solid var(--line)}
.apri label.scelta{padding:11px 4px;color:var(--text)}
.apri label.scelta+label.scelta{border-top:1px solid var(--line)}
.sopraPiede{padding:10px 34px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--panel) 55%,transparent)}
.piede{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:11px 34px 13px;border-top:1px solid var(--line)}
.piede .msg{margin-right:auto;color:var(--red);font-size:13px}
.btn{border:0;border-radius:9px;padding:10px 24px;font:800 13px var(--display);font-stretch:112%;letter-spacing:.08em;text-transform:uppercase;min-height:40px;transition:transform .15s,box-shadow .15s,background .15s}
.btn.primary{background:var(--text);color:var(--bg)}
.btn.primary:hover{background:#fff;transform:translateY(-1px);box-shadow:0 0 0 3px color-mix(in srgb,var(--text) 14%,transparent)}
.btn.primary:disabled{opacity:.35;cursor:default;box-shadow:none;transform:none}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--line);font-weight:700}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--muted)}
.btn.ghost:disabled{opacity:.35;cursor:default}
.velo{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(3px);display:none;place-items:center;z-index:9}
.velo.on{display:grid}
.finestra{width:min(520px,90vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.finestra h2{margin:0;font-family:var(--display);font-weight:800;font-stretch:112%;font-size:19px;text-transform:uppercase;letter-spacing:-.01em}
.finestra h2::after{content:"";display:block;width:32px;height:3px;background:var(--a1);margin-top:10px}
.finestra .riga{justify-content:flex-end;margin-top:6px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;display:none;z-index:10}
.toast.on{display:block}
/* programmi in aggiornamento (badge + nota): tutto in una schermata */
#p1:has(#notaAgg:not([hidden])){gap:10px}#p1:has(#notaAgg:not([hidden])) .testa{gap:18px}#p1:has(#notaAgg:not([hidden])) .testa .gmask{width:52px}#p1:has(#notaAgg:not([hidden])) h1{font-size:24px}#p1:has(#notaAgg:not([hidden])) h1::after{margin-top:9px}#p1:has(#notaAgg:not([hidden])) .testa>div{gap:9px}
#p1:has(#notaAgg:not([hidden])) .nota{padding:8px 12px;line-height:1.4}#p1:has(#notaAgg:not([hidden])) .comp{gap:8px}#p1:has(#notaAgg:not([hidden])) .carta{padding:10px 12px}#p1:has(#notaAgg:not([hidden])) .carta .badge{margin-top:5px}
/* contrasto leggibile (>= 4.5:1) */
ol.passi li i,.ver,.lingue button span{color:#7A808D}
.carta.no{opacity:1}.carta.no img,.carta.no input{opacity:.45}.carta.no b{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.barra i{transition:none}.gmask .look,.gmask .eye{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><img id="faccia" src="{{ICONA:gaming}}" alt=""><div><b>TASSO</b><small id="sottoBrand">SETUP</small></div></div>
    <ol class="passi" id="passi">
      <li data-p="0"><i>01</i><span data-t="passo_lingua"></span></li>
      <li data-p="1"><i>02</i><span data-t="passo_componenti"></span></li>
      <li data-p="2"><i>03</i><span data-t="passo_cartella"></span></li>
      <li data-p="3"><i>04</i><span data-t="passo_installa"></span></li>
    </ol>
    <div class="ver" id="versione"></div>
  </aside>
  <main>
    <!-- 0. lingua -->
    <section class="pagina" id="p0">
      <div class="k">01 · <span data-t="passo_lingua"></span></div>
      <div class="testa big"><svg class="gmask" viewBox="0 0 240 220" aria-hidden="true"><path d="M44 22 H196 L226 104 L120 206 L14 104 Z" fill="var(--text)"/><path d="M80 22 H106 L108 142 L56 132 L36 98 Z" fill="var(--bg)"/><path d="M160 22 H134 L132 142 L184 132 L204 98 Z" fill="var(--bg)"/><g class="look"><circle class="eye" cx="82" cy="112" r="12" fill="var(--a1)"/></g><g class="look"><circle class="eye" cx="158" cy="112" r="12" fill="var(--a1)"/></g><path d="M100 164 H140 L120 190 Z" fill="var(--bg)"/></svg><div><h1 data-t="lingua_titolo"></h1><p class="sub" data-t="lingua_sotto"></p></div></div>
      <div class="lingue" id="lingue"></div>
    </section>
    <!-- 1. componenti -->
    <section class="pagina" id="p1">
      <div class="k">02 · <span data-t="passo_componenti"></span></div>
      <div class="testa"><svg class="gmask" viewBox="0 0 240 220" aria-hidden="true"><path d="M44 22 H196 L226 104 L120 206 L14 104 Z" fill="var(--text)"/><path d="M80 22 H106 L108 142 L56 132 L36 98 Z" fill="var(--bg)"/><path d="M160 22 H134 L132 142 L184 132 L204 98 Z" fill="var(--bg)"/><g class="look"><circle class="eye" cx="82" cy="112" r="12" fill="var(--a1)"/></g><g class="look"><circle class="eye" cx="158" cy="112" r="12" fill="var(--a1)"/></g><path d="M100 164 H140 L120 190 Z" fill="var(--bg)"/></svg><div><h1 data-t="comp_titolo"></h1><p class="sub" data-t="comp_sotto"></p></div></div>
      <div class="comp" id="comp"></div>
      <div class="nota" data-t="comp_nota_tasso"></div>
      <div class="nota" id="notaAgg" hidden></div>
    </section>
    <!-- 2. cartella -->
    <section class="pagina" id="p2">
      <div class="k">03 · <span data-t="passo_cartella"></span></div>
      <div class="testa"><svg class="gmask" viewBox="0 0 240 220" aria-hidden="true"><path d="M44 22 H196 L226 104 L120 206 L14 104 Z" fill="var(--text)"/><path d="M80 22 H106 L108 142 L56 132 L36 98 Z" fill="var(--bg)"/><path d="M160 22 H134 L132 142 L184 132 L204 98 Z" fill="var(--bg)"/><g class="look"><circle class="eye" cx="82" cy="112" r="12" fill="var(--a1)"/></g><g class="look"><circle class="eye" cx="158" cy="112" r="12" fill="var(--a1)"/></g><path d="M100 164 H140 L120 190 Z" fill="var(--bg)"/></svg><div><h1 data-t="cart_titolo"></h1><p class="sub" data-t="cart_sotto"></p></div></div>
      <div class="riga"><input type="text" id="cartella" spellcheck="false" aria-label="Cartella"><button class="btn ghost" id="sfoglia" data-t="cart_sfoglia"></button></div>
      <div class="nota errore" id="errCartella" hidden></div>
      <div class="nota avviso" id="avvCartella" hidden data-t="cart_fuori_programmi"></div>
      <div class="percorsi" id="percorsi"></div>
      <div class="spazio" id="spazio"></div>
      <label class="scelta fissa"><input type="checkbox" checked disabled><span data-t="coll_menu"></span></label>
      <label class="scelta"><input type="checkbox" id="desktop"><span data-t="coll_desktop"></span></label>
    </section>
    <!-- 3. installazione -->
    <section class="pagina" id="p3">
      <div class="k">04 · <span data-t="passo_installa"></span></div>
      <div class="lavoro"><svg class="gmask" viewBox="0 0 240 220" aria-hidden="true"><path d="M44 22 H196 L226 104 L120 206 L14 104 Z" fill="var(--text)"/><path d="M80 22 H106 L108 142 L56 132 L36 98 Z" fill="var(--bg)"/><path d="M160 22 H134 L132 142 L184 132 L204 98 Z" fill="var(--bg)"/><g class="look"><circle class="eye" cx="82" cy="112" r="12" fill="var(--a1)"/></g><g class="look"><circle class="eye" cx="158" cy="112" r="12" fill="var(--a1)"/></g><path d="M100 164 H140 L120 190 Z" fill="var(--bg)"/></svg><div><div class="perc" id="perc">0%</div>
      <div class="barra"><i id="barra"></i></div>
      <div class="fase" id="fase"></div></div></div>
    </section>
    <!-- 4. fine -->
    <section class="pagina" id="p4">
      <div class="k" data-t="passo_installa"></div>
      <div class="testa big"><svg class="gmask" viewBox="0 0 240 220" aria-hidden="true"><path d="M44 22 H196 L226 104 L120 206 L14 104 Z" fill="var(--text)"/><path d="M80 22 H106 L108 142 L56 132 L36 98 Z" fill="var(--bg)"/><path d="M160 22 H134 L132 142 L184 132 L204 98 Z" fill="var(--bg)"/><g class="look"><circle class="eye" cx="82" cy="112" r="12" fill="var(--a1)"/></g><g class="look"><circle class="eye" cx="158" cy="112" r="12" fill="var(--a1)"/></g><path d="M100 164 H140 L120 190 Z" fill="var(--bg)"/></svg><div><h1 data-t="fine_titolo"></h1><p class="sub" data-t="fine_sotto"></p></div></div>
      <div class="nota avviso" id="avvColl" hidden data-t="fine_avviso_coll"></div>
      <div class="apri" id="apri"></div>
    </section>
    <!-- 5. errore -->
    <section class="pagina" id="p5">
      <div class="k" data-t="k_errore"></div>
      <div class="testa"><svg class="gmask" viewBox="0 0 240 220" aria-hidden="true"><path d="M44 22 H196 L226 104 L120 206 L14 104 Z" fill="var(--text)"/><path d="M80 22 H106 L108 142 L56 132 L36 98 Z" fill="var(--bg)"/><path d="M160 22 H134 L132 142 L184 132 L204 98 Z" fill="var(--bg)"/><g class="look"><circle class="eye" cx="82" cy="112" r="12" fill="var(--a1)"/></g><g class="look"><circle class="eye" cx="158" cy="112" r="12" fill="var(--a1)"/></g><path d="M100 164 H140 L120 190 Z" fill="var(--bg)"/></svg><div><h1 data-t="err_titolo"></h1></div></div>
      <div class="nota errore" id="errTesto"></div>
    </section>
    <!-- 6. disinstalla -->
    <section class="pagina" id="p6">
      <div class="k" data-t="k_disinstalla"></div>
      <div class="testa"><svg class="gmask" viewBox="0 0 240 220" aria-hidden="true"><path d="M44 22 H196 L226 104 L120 206 L14 104 Z" fill="var(--text)"/><path d="M80 22 H106 L108 142 L56 132 L36 98 Z" fill="var(--bg)"/><path d="M160 22 H134 L132 142 L184 132 L204 98 Z" fill="var(--bg)"/><g class="look"><circle class="eye" cx="82" cy="112" r="12" fill="var(--a1)"/></g><g class="look"><circle class="eye" cx="158" cy="112" r="12" fill="var(--a1)"/></g><path d="M100 164 H140 L120 190 Z" fill="var(--bg)"/></svg><div><h1 data-t="dis_titolo"></h1><p class="sub" data-t="dis_sotto"></p></div></div>
      <div class="comp" id="compDis"></div>
      <div class="nota" id="notaDis" data-t="dis_nota_tasso"></div>
    </section>
    <!-- 7. disinstallazione finita -->
    <section class="pagina" id="p7">
      <div class="k" data-t="k_disinstalla"></div>
      <div class="testa big"><svg class="gmask" viewBox="0 0 240 220" aria-hidden="true"><path d="M44 22 H196 L226 104 L120 206 L14 104 Z" fill="var(--text)"/><path d="M80 22 H106 L108 142 L56 132 L36 98 Z" fill="var(--bg)"/><path d="M160 22 H134 L132 142 L184 132 L204 98 Z" fill="var(--bg)"/><g class="look"><circle class="eye" cx="82" cy="112" r="12" fill="var(--a1)"/></g><g class="look"><circle class="eye" cx="158" cy="112" r="12" fill="var(--a1)"/></g><path d="M100 164 H140 L120 190 Z" fill="var(--bg)"/></svg><div><h1 data-t="fine_titolo"></h1><p class="sub" id="disEsito"></p></div></div>
      <div class="nota avviso" id="disNonTolti" hidden></div>
    </section>
    <!-- disinstalla: la casella dei dati sta sopra i pulsanti, sempre visibile senza scorrere -->
    <div class="sopraPiede" id="rigaDati" hidden>
      <label class="scelta" id="sceltaDati"><input type="checkbox" id="disDati"><span data-t="dis_dati"></span></label>
    </div>
    <div class="piede">
      <span class="msg" id="msg" role="alert"></span>
      <button class="btn ghost" id="bIndietro" data-t="indietro"></button>
      <button class="btn ghost" id="bAnnulla" data-t="annulla" hidden></button>
      <button class="btn primary" id="bAvanti" data-t="avanti"></button>
    </div>
  </main>
</div>
<div class="velo" id="velo"><div class="finestra" role="dialog" aria-modal="true" aria-labelledby="veloTit">
  <h2 id="veloTit" data-t="aperti_titolo"></h2>
  <div id="veloTesto" class="sub"></div>
  <div class="riga"><button class="btn ghost" id="veloNo" data-t="annulla"></button><button class="btn primary" id="veloSi" data-t="aperti_chiudi"></button></div>
</div></div>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const ICONE = {gaming:'{{ICONA:gaming}}', ufficio:'{{ICONA:ufficio}}', zip:'{{ICONA:zip}}', pdf:'{{ICONA:pdf}}'};
const call = (n, ...a) => window[n](...a);
let A = null;          // dati da Go (goAvvio)
let L = 'it';          // lingua scelta
let P = 0;             // pagina
let scelti = {};       // componente -> spuntato
let dis = {};          // disinstalla: componente -> spuntato
let cart = null;       // ultimo controllo della cartella
let lavoro = false;    // installazione in corso
let fattoOk = null;    // esito installazione

function T(k, ...v){ let s = (A && A.testi[L] && A.testi[L][k]) || (A && A.testi.it[k]) || k; v.forEach(x => { s = s.replace('%s', x); }); return s; }
function traduci(){
  document.documentElement.lang = L;
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = T(e.dataset.t); });
  document.title = T('titolo');
}
function dim(n){
  const u = ['B','KB','MB','GB','TB']; let i = 0; n = Number(n) || 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return new Intl.NumberFormat(L, {maximumFractionDigits: i >= 3 ? 1 : 0}).format(n) + ' ' + u[i];
}
function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 3500); }
function msg(t){ $('#msg').textContent = t || ''; }
// Mentre aspetto Tasso (può volerci qualche minuto) il messaggio cambia: il passo di Tasso e il
// tempo che passa, così nessuno pensa che il setup sia bloccato (R2).
const attesaTasso = { t0: 0, passo: -1, timer: null };
function attesaScrivi(){
  if (!attesaTasso.t0) return;
  const s = Math.floor((Date.now() - attesaTasso.t0) / 1000);
  const tempo = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  const t = attesaTasso.passo >= 0 ? T('dis_tasso_passo_' + attesaTasso.passo) : attesaTasso.passo === -2 ? T('dis_in_corso') : T('dis_tasso_attesa');
  $('#msg').style.color = 'var(--muted)'; $('#msg').textContent = t + ' · ' + tempo;
}
function attesaInizio(p){ attesaTasso.t0 = Date.now(); attesaTasso.passo = p == null ? -1 : p; attesaScrivi(); attesaTasso.timer = setInterval(attesaScrivi, 1000); }
function attesaFine(){ clearInterval(attesaTasso.timer); attesaTasso.timer = null; attesaTasso.t0 = 0; }
const nomeComp = id => T('comp_' + id + '_nome');
const compScelti = () => A.componenti.map(c => c.id).filter(id => scelti[id]);

function vai(p){
  P = p; msg('');
  document.querySelectorAll('.pagina').forEach(e => e.classList.toggle('on', e.id === 'p' + p));
  const passo = p <= 4 ? Math.min(p, 3) : (p === 5 ? 3 : -1);
  document.querySelectorAll('#passi li').forEach(li => { const n = +li.dataset.p; li.classList.toggle('on', n === passo && p !== 4); li.classList.toggle('fatto', n < passo || p === 4); });
  $('#passi').hidden = A.modo === 'disinstalla';
  $('#rigaDati').hidden = p !== 6 || $('#sceltaDati').hidden;
  const ind = $('#bIndietro'), av = $('#bAvanti'), ann = $('#bAnnulla');
  ind.hidden = !(p === 1 || p === 2); ann.hidden = true; av.hidden = false; av.disabled = false;
  if (p === 0 || p === 1) av.textContent = T('avanti');
  if (p === 2) { av.textContent = A.installata ? T('aggiorna') : T('installa'); controllaCartella(); }
  if (p === 3) { av.hidden = true; ann.hidden = false; ann.disabled = false; ann.textContent = T('annulla'); } // anche dopo Riprova (in 5 dice Chiudi)
  if (p === 4 || p === 7) { av.textContent = T('chiudi'); }
  if (p === 5) { av.textContent = T('riprova'); ann.hidden = false; ann.textContent = T('chiudi'); }
  if (p === 6) { av.textContent = T('dis_bottone'); ann.hidden = false; ann.textContent = T('annulla'); }
  const f = document.querySelector('.pagina.on h1'); if (f) f.setAttribute('tabindex', '-1');
}

function disegnaLingue(){
  const box = $('#lingue'); box.innerHTML = '';
  A.lingue.forEach(l => {
    const b = document.createElement('button'); b.type = 'button';
    b.className = l.codice === L ? 'on' : ''; b.setAttribute('aria-pressed', l.codice === L ? 'true' : 'false');
    b.innerHTML = '<b></b><span></span>'; b.firstChild.textContent = l.nome; b.lastChild.textContent = l.codice;
    b.onclick = () => { L = l.codice; call('goLingua', L); traduci(); disegnaLingue(); disegnaComp(); vai(P); };
    box.appendChild(b);
  });
}

function carta(c, mappa, testoExtra){
  const lab = document.createElement('label'); lab.className = 'carta ' + (mappa[c.id] ? 'si' : 'no');
  lab.innerHTML = '<img alt=""><div class="t"><b></b><p></p></div><input type="checkbox">';
  lab.querySelector('img').src = ICONE[c.id];
  lab.querySelector('b').textContent = nomeComp(c.id);
  lab.querySelector('p').textContent = T('comp_' + c.id + '_desc');
  if (testoExtra) { const s = document.createElement('span'); s.className = 'badge'; s.textContent = testoExtra; lab.querySelector('.t').appendChild(s); }
  const cb = lab.querySelector('input'); cb.checked = !!mappa[c.id];
  cb.setAttribute('aria-label', nomeComp(c.id));
  cb.onchange = () => { mappa[c.id] = cb.checked; lab.className = 'carta ' + (cb.checked ? 'si' : 'no'); msg(''); if (mappa === dis) aggiornaSceltaDati(A.preScelti); };
  return lab;
}
function disegnaComp(){
  const box = $('#comp'); box.innerHTML = '';
  A.componenti.forEach(c => box.appendChild(carta(c, scelti, c.piuNuovo ? T('comp_piu_nuovo', c.piuNuovo) : (c.installato ? T('comp_installato', c.installato) : ''))));
  const n = $('#notaAgg'); n.hidden = !A.installata;
  if (A.installata) n.textContent = T('agg_nota', A.installata.versione) + (A.installata.vecchio ? '\n' + T('agg_vecchio', A.versione) : '');
  const d = $('#compDis'); d.innerHTML = '';
  if (A.installata) A.componenti.filter(c => A.installata.componenti.includes(c.id)).forEach(c => d.appendChild(carta(c, dis, c.installato ? T('comp_installato', c.installato) : '')));
}

async function controllaCartella(){
  const p = $('#cartella').value;
  const r = await call('goControllaCartella', p, compScelti());
  if (p !== $('#cartella').value) return; // l'utente ha già scritto altro
  cart = r;
  const e = $('#errCartella'); e.hidden = !r.errore; if (r.errore) e.textContent = T(r.errore);
  $('#avvCartella').hidden = !!r.errore || !r.fuoriProgrammi;
  $('#avvCartella').dataset.t = r.senzaPermessi ? 'cart_avv_senza_permessi' : 'cart_fuori_programmi'; // anche cambiando lingua
  $('#avvCartella').textContent = T($('#avvCartella').dataset.t);
  const box = $('#percorsi'); box.innerHTML = '';
  if (!r.errore) {
    const righe = [];
    if (scelti.gaming || scelti.ufficio) righe.push([scelti.gaming ? 'gaming' : 'ufficio', 'Tasso', r.percorsi.tasso]);
    if (scelti.zip) righe.push(['zip', nomeComp('zip'), r.percorsi.zip]);
    if (scelti.pdf) righe.push(['pdf', nomeComp('pdf'), r.percorsi.pdf]);
    righe.forEach(x => { const d = document.createElement('div'); d.innerHTML = '<img alt=""><b></b><code></code>'; d.querySelector('img').src = ICONE[x[0]]; d.querySelector('b').textContent = x[1]; d.querySelector('code').textContent = x[2]; d.title = x[2]; box.appendChild(d); });
  }
  $('#spazio').textContent = r.errore ? '' : T('cart_spazio', dim(r.serve), r.libero > 0 ? dim(r.libero) : '?');
  if (!r.errore && r.libero > 0 && r.libero < r.serve) { e.hidden = false; e.textContent = T('cart_poco_spazio'); }
  $('#bAvanti').disabled = !!r.errore || (r.libero > 0 && r.libero < r.serve);
}

async function installa(ripeti){
  const opz = ripeti || {cartella: $('#cartella').value, componenti: compScelti(), desktop: $('#desktop').checked,
    desktopTogli: !!(A.installata && A.installata.desktop) && !$('#desktop').checked, lingua: L};
  ultimaOpz = opz;
  const aperti = await call('goProgrammiAperti', opz.cartella, opz.componenti);
  if (aperti && aperti.length) {
    const ok = await chiediChiusura(aperti);
    if (!ok) return;
    if (!await call('goChiudiProgrammi', opz.cartella, opz.componenti)) { msg(T('aperti_errore')); return; }
  }
  lavoro = true; fattoOk = null;
  $('#barra').style.width = '0'; $('#perc').textContent = '0%'; $('#fase').textContent = T('fase_prepara');
  vai(3);
  const r = await call('goInstalla', opz);
  if (r !== 'ok') { lavoro = false; mostraErrore(r); }
}
function chiediChiusura(nomi){
  return new Promise(ok => {
    $('#veloTesto').textContent = T('aperti_testo', nomi.join(', '));
    $('#velo').classList.add('on'); $('#veloSi').focus();
    $('#veloSi').onclick = () => { $('#velo').classList.remove('on'); ok(true); };
    $('#veloNo').onclick = () => { $('#velo').classList.remove('on'); ok(false); };
  });
}
let ultimaOpz = null;  // le scelte dell'ultima installazione (per Riprova)
let erroreCartella = false;
function mostraErrore(r){
  const conDettagli = r && (r.codice === 'err_generico' || r.codice === 'err_bloccato' || r.codice === 'agg_vecchio');
  let t = r && r.codice ? (conDettagli ? T(r.codice, r.dettagli || '') : T(r.codice)) : T('err_generico', String(r && r.dettagli || r));
  if (r && r.diario) t += '\n\n' + T('err_diario', r.diario);
  erroreCartella = !!(r && r.codice && String(r.codice).startsWith('cart_'));
  $('#errTesto').textContent = t; vai(5);
}

// eventi da Go
window.TS = {
  // Tasso toglie le sue cose (--togli-silenzioso): il passo che comincia adesso
  passoTasso(n){ attesaTasso.passo = n; attesaScrivi(); },
  avanza(a){
    if (a.fase === 'fine') return;
    const p = a.totale > 0 ? Math.min(100, Math.floor(a.fatto * 100 / a.totale)) : 0;
    $('#barra').style.width = p + '%'; $('#perc').textContent = p + '%';
    $('#fase').textContent = a.fase === 'copia' ? T('fase_copia', a.file || '') : T('fase_' + a.fase);
    $('#bAnnulla').disabled = a.fase !== 'copia' && a.fase !== 'prepara';
  },
  finito(r){
    lavoro = false;
    if (!r.ok) { mostraErrore(r); return; }
    fattoOk = r;
    $('#avvColl').hidden = !r.avvisoCollegamenti;
    const box = $('#apri'); box.innerHTML = '';
    (r.apribili || []).forEach(id => {
      const l = document.createElement('label'); l.className = 'scelta';
      l.innerHTML = '<input type="checkbox"><span></span>';
      l.querySelector('input').checked = id === r.apribili[0]; l.querySelector('input').dataset.id = id;
      l.querySelector('span').textContent = T('fine_apri', id === 'tasso' ? 'Tasso' : nomeComp(id));
      box.appendChild(l);
    });
    $('#barra').style.width = '100%'; $('#perc').textContent = '100%';
    vai(4);
  },
  chiusura(){ toast(T('uscita_durante')); },
};

$('#bAvanti').onclick = async () => {
  if (P === 0) { vai(1); return; }
  if (P === 1) { if (!compScelti().length) { msg(T('comp_nessuno')); return; } vai(2); return; }
  if (P === 2) { installa(); return; }
  if (P === 4) { const ids = [...document.querySelectorAll('#apri input:checked')].map(i => i.dataset.id); await call('goApri', ids); call('goChiudi'); return; }
  // Riprova: rifà subito l'installazione con le stesse scelte (richiude i programmi se serve);
  // solo con un problema della cartella si torna alla pagina della cartella
  if (P === 5) { if (erroreCartella || !ultimaOpz) { vai(2); return; } installa(ultimaOpz); return; }
  if (P === 6) { disinstalla(); return; }
  if (P === 7) { call('goChiudi'); }
};
$('#bIndietro').onclick = () => { if (P > 0) vai(P - 1); };
$('#bAnnulla').onclick = () => { if (P === 3) { $('#bAnnulla').disabled = true; call('goAnnulla'); } else call('goChiudi'); };
$('#sfoglia').onclick = async () => { const p = await call('goScegliCartella', $('#cartella').value, T('cart_scegli')); if (p) { $('#cartella').value = p; controllaCartella(); } };
$('#cartella').oninput = () => { clearTimeout(controllaCartella.t); controllaCartella.t = setTimeout(controllaCartella, 250); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#velo').classList.contains('on')) $('#veloNo').click(); });

// la casella "togli anche i dati di Tasso" solo se va via Tasso stesso: tutti i suoi componenti
// installati (Gaming e Ufficio) sono tra quelli da togliere. Da "Togli Tasso dal PC" mai (i dati
// li ha già tolti Tasso).
function aggiornaSceltaDati(pre){
  const inst = (A.installata && A.installata.componenti) || [];
  const tasso = inst.filter(id => id === 'gaming' || id === 'ufficio');
  const via = tasso.length > 0 && tasso.every(id => dis[id]);
  $('#sceltaDati').hidden = !!(pre && pre.length) || !via;
  if ($('#sceltaDati').hidden) $('#disDati').checked = false;
  $('#rigaDati').hidden = P !== 6 || $('#sceltaDati').hidden;
}
async function disinstalla(){
  // solo quelli installati (dis parte spuntato anche per quelli che non ci sono): tutti tolti = dis_nessuno
  const ids = A.componenti.map(c => c.id).filter(id => dis[id] && ((A.installata && A.installata.componenti) || []).includes(id));
  if (!ids.length) { msg(T('dis_nessuno')); return; }
  const aperti = await call('goProgrammiAperti', A.cartella, ids);
  if (aperti && aperti.length && !await chiediChiusura(aperti)) return;
  $('#bAvanti').disabled = true; $('#bAnnulla').disabled = true; msg(''); $('#msg').style.color = 'var(--muted)'; $('#msg').textContent = T('dis_in_corso');
  // prima Tasso toglie le sue cose (chiude solo Tasso); se rifiuta, Zip e PDF restano aperti
  attesaInizio();
  const pr = await call('goPreparaDisinstalla', ids);
  attesaFine();
  if (!pr || !pr.ok) {
    $('#msg').style.color = ''; $('#bAvanti').disabled = false; $('#bAnnulla').disabled = false;
    msg(pr && pr.rifiuta ? T('dis_rifiuta', pr.dettagli || '') : T('aperti_errore')); return;
  }
  if (aperti && aperti.length && !await call('goChiudiProgrammi', A.cartella, ids)) {
    $('#msg').style.color = ''; $('#bAvanti').disabled = false; $('#bAnnulla').disabled = false;
    msg(T('aperti_errore')); return;
  }
  $('#msg').textContent = T('dis_in_corso');
  attesaInizio(-2); // -2: "Tolgo i programmi scelti…"; il passo di Tasso, se c'è, arriva da passoTasso
  const r = await call('goDisinstalla', ids, !!$('#disDati').checked && !$('#sceltaDati').hidden);
  attesaFine();
  $('#msg').style.color = '';
  if (!r.ok) { $('#bAvanti').disabled = false; $('#bAnnulla').disabled = false; msg(r.rifiuta ? T('dis_rifiuta', r.dettagli || '') : r.copieNonSalvate ? T('dis_copie_non_salvate', r.dettagli || '') : T('err_generico', r.dettagli || '')); return; }
  $('#disEsito').textContent = r.tuttoTolto ? T('dis_tutto') : T('dis_fatto');
  const nt = $('#disNonTolti'); const righe = [];
  if (r.nonTolti && r.nonTolti.length) righe.push(T('dis_non_tolti', r.nonTolti.join(', ')));
  if (r.alRiavvio && r.alRiavvio.length) righe.push(T('dis_al_riavvio', r.alRiavvio.join(', ')));
  if (r.datiTenuti && r.datiTenuti.length) righe.push(T('dis_dati_tenuti', r.datiTenuti.join(', ')));
  if (r.copieSalvate && r.copieSalvate.length) righe.push(T('dis_copie_salvate', r.copieSalvate.join(', ')));
  nt.hidden = !righe.length; if (!nt.hidden) nt.textContent = righe.join('\n');
  vai(7);
}

(async () => {
  A = await call('goAvvio');
  L = A.lingua || 'it';
  // disinstalla: tutti spuntati, o solo quelli chiesti con --scegli= (da "Togli Tasso dal PC")
  const pre = (A.preScelti || []).filter(id => A.componenti.some(c => c.id === id));
  // installa: tutti spuntati; aggiornamento: solo quelli già installati e non già più nuovi
  // (mai aggiungere di nascosto un programma che non c'era, mai tornare indietro)
  A.componenti.forEach(c => {
    scelti[c.id] = A.installata ? (A.installata.componenti.includes(c.id) && !c.piuNuovo) : true;
    dis[c.id] = pre.length ? pre.includes(c.id) : true;
  });
  // i dati di Tasso: solo se l'utente lo spunta; da "Togli Tasso dal PC" li ha già tolti Tasso
  aggiornaSceltaDati(pre);
  $('#cartella').value = A.cartella || '';
  if (A.installata) { $('#cartella').readOnly = true; $('#sfoglia').hidden = true; } // aggiornamento: stessa cartella
  $('#desktop').checked = !!(A.installata && A.installata.desktop); // aggiornamento: il Desktop resta com'era
  $('#versione').textContent = 'TASSO ' + (A.versione || '');
  traduci(); disegnaLingue(); disegnaComp();
  if (A.modo === 'disinstalla') {
    $('#sottoBrand').textContent = T('dis_bottone').toUpperCase();
    if (!A.installata) { $('#errTesto').textContent = T('dis_niente'); vai(5); $('#bAvanti').hidden = true; return; }
    vai(6); return;
  }
  if (A.vuoto) { $('#errTesto').textContent = T('err_vuoto'); vai(5); $('#bAvanti').hidden = true; return; }
  vai(0);
})();
</script>
</body>
</html>
