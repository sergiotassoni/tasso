<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Tasso Zip</title>
<style>
/* Caratteri Archivo e Onest dentro il programma (funzionano senza internet). Licenza SIL OFL 1.1. */
/*CARATTERI*/
:root{
  --bg:#07080D;--side:#0D0F16;--panel:#12141E;--line:#22263A;--text:#F2F4F8;--muted:#8B91A7;
  --a1:#2FF3A6;--a2:#A77BFF;--a3:#4DA8FF;--a4:#FFB547;--ink:#04140D;--red:#FF6B5C;
  --display:'TassoArchivo','Bahnschrift','Segoe UI Variable Display','Segoe UI',sans-serif;
  --body:'TassoOnest','Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;
  --soft:color-mix(in srgb,var(--text) 72%,var(--bg));
  --panel2:color-mix(in srgb,var(--panel) 80%,var(--text) 4%);
  --hover:color-mix(in srgb,var(--panel) 85%,var(--text) 8%);
  --track:color-mix(in srgb,var(--line) 75%,var(--bg));
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;overflow:hidden;user-select:none}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,label.sw:focus-within{outline:2px solid var(--a3);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:14px;padding:16px 28px;border-bottom:1px solid var(--line);background:var(--side)}
header .tit b{display:block;font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.2px}
header .tit small{color:var(--muted);font-size:12.5px}
.lingue{margin-left:auto;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.lingue button{border:0;background:transparent;color:var(--soft);font-weight:700;font-size:12px;letter-spacing:.4px;padding:6px 9px;border-radius:8px;min-width:34px}
.lingue button:hover{background:var(--hover);color:var(--text)}
.lingue button.on{background:var(--a3);color:#06121F}
main{flex:1;min-height:0;overflow-y:auto;padding:30px 36px 24px;position:relative}
main::-webkit-scrollbar{width:10px}main::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:3px solid var(--bg)}
.view{display:none;flex-direction:column;gap:22px;max-width:980px;margin:0 auto}
.view.on{display:flex}
.view.stretto{gap:16px}
.view.stretto h1{font-size:30px}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:-.4px}
h2{margin:0;font-family:var(--display);font-size:21px;font-weight:700}
.sub{color:var(--muted);margin:6px 0 0;line-height:1.5}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.card{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px}
.card .glow{position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;filter:blur(30px);opacity:.38;pointer-events:none}
.card.c .glow{background:radial-gradient(circle,var(--a3),transparent 70%)}
.card.e .glow{background:radial-gradient(circle,var(--a1),transparent 70%)}
.ico{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;margin-bottom:22px}
.card.c .ico{background:color-mix(in srgb,var(--a3) 18%,var(--panel))}
.card.e .ico{background:color-mix(in srgb,var(--a1) 15%,var(--panel))}
.card h2{margin-bottom:12px}
.card p{margin:0 0 22px;color:var(--soft);line-height:1.6;font-size:14.5px;max-width:440px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;font-size:14.5px;min-height:46px;transition:filter .15s,background .15s;font-family:var(--display)}
.btn.blu{background:var(--a3);color:#04101C}
.btn.verde{background:var(--a1);color:var(--ink)}
.btn.blu:hover,.btn.verde:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--hover)}
.btn.rosso{background:color-mix(in srgb,var(--red) 18%,var(--panel));color:var(--text);border:1px solid color-mix(in srgb,var(--red) 50%,var(--line))}
.btn:disabled{opacity:.45;cursor:default}
.nota{display:flex;align-items:center;gap:14px;border:1.5px dashed var(--line);border-radius:18px;padding:18px 22px;color:var(--soft);line-height:1.5}
.nota svg{flex:none}
footer{display:flex;align-items:center;gap:12px;padding:12px 28px;border-top:1px solid var(--line);background:var(--side);min-height:58px}
footer .eco{margin-left:auto;color:var(--a3);font-weight:700;font-family:var(--display)}
footer .ver{color:var(--muted);font-size:12.5px}
footer .lbl{color:var(--soft)}
footer .lbl small{display:block;color:var(--muted);font-size:11.5px}
label.sw{position:relative;display:inline-block;width:42px;height:24px;flex:none;border-radius:99px;cursor:pointer}
label.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
label.sw span{position:absolute;inset:0;background:var(--track);border:1px solid var(--line);border-radius:99px;transition:background .2s}
label.sw span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
label.sw input:checked+span{background:var(--a3);border-color:var(--a3)}
label.sw input:checked+span::after{transform:translateX(18px)}
/* lista dei file scelti */
.lista{display:flex;flex-direction:column;gap:6px;max-height:172px;overflow-y:auto;padding-right:4px}
.lista::-webkit-scrollbar{width:8px}.lista::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.el{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.el .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.el .d{color:var(--muted);font-size:12.5px;white-space:nowrap}
.el button{border:0;background:transparent;color:var(--muted);font-size:12.5px;padding:4px 8px;border-radius:8px}
.el button:hover{background:var(--hover);color:var(--text)}
.formati{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.fmt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel2);border:1.5px solid var(--line);border-radius:16px;padding:13px 15px}
.fmt:hover{background:var(--hover)}
.fmt.on{border-color:var(--a3);background:color-mix(in srgb,var(--a3) 10%,var(--panel))}
.fmt .pt{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:2px}
.fmt.on .pt{border-color:var(--a3);box-shadow:inset 0 0 0 4px var(--panel),inset 0 0 0 10px var(--a3)}
.fmt b{display:block;font-family:var(--display);font-size:15px;margin-bottom:4px}
.fmt span{color:var(--muted);font-size:13px;line-height:1.45}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{color:var(--muted);font-size:12.5px;font-weight:600}
input[type=text],input[type=password]{background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--text);font:inherit;font-size:15px;padding:11px 14px;min-height:46px;width:100%;user-select:text}
input[type=text]:focus,input[type=password]:focus{outline:none;border-color:var(--a3)}
.dove{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* lavoro */
.centro{align-items:center;text-align:center;padding-top:30px}
.barra{width:min(560px,100%);height:14px;background:var(--track);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a3),var(--a1));border-radius:99px;transition:width .15s}
.barra.indef i{width:30%!important;animation:va 1.2s ease-in-out infinite}
@keyframes va{0%{margin-left:-30%}100%{margin-left:100%}}
.perc{font-family:var(--display);font-size:44px;font-weight:700}
.corrente{color:var(--muted);max-width:560px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:20px}
.grande{width:84px;height:84px;border-radius:24px;display:grid;place-items:center}
.grande.ok{background:color-mix(in srgb,var(--a1) 16%,var(--panel))}
.grande.ko{background:color-mix(in srgb,var(--red) 16%,var(--panel))}
.grande.pw{background:color-mix(in srgb,var(--a4) 16%,var(--panel))}
.percorso{font-size:13px;color:var(--soft);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;max-width:640px;word-break:break-all;user-select:text}
details{max-width:640px;width:100%;text-align:left;color:var(--muted);font-size:12.5px}
details summary{cursor:pointer;color:var(--soft)}
details pre{white-space:pre-wrap;word-break:break-all;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:150px;overflow:auto;user-select:text;font-family:'Cascadia Mono',Consolas,monospace}
.avviso{color:var(--a4);font-size:13px;max-width:640px}
.errpw{color:var(--red);font-weight:600;min-height:20px}
.pwbox{display:flex;gap:8px;width:min(460px,100%)}
/* trascinamento */
#drop{position:fixed;inset:0;display:none;grid-template-columns:1fr 1fr;gap:16px;padding:18px;background:rgba(7,8,13,.95);backdrop-filter:blur(6px);z-index:50}
#drop.on{display:grid}
#drop.solo{grid-template-columns:1fr}
#drop.solo .de{display:none}
#drop div{background:var(--panel);border:2.5px dashed var(--line);border-radius:24px;display:grid;place-items:center;font-family:var(--display);font-size:22px;font-weight:700;color:var(--soft);text-align:center;padding:20px}
#drop div.sopra.dc{border-color:var(--a3);color:var(--a3);background:color-mix(in srgb,var(--a3) 8%,transparent)}
#drop div.sopra.de{border-color:var(--a1);color:var(--a1);background:color-mix(in srgb,var(--a1) 8%,transparent)}
#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px 18px;border-radius:12px;opacity:0;transition:all .25s;pointer-events:none;z-index:60;max-width:80%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
/* vista dell'archivio */
.view.largo{max-width:1200px;gap:14px}
.tronca{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#v-archivio h1{font-size:26px}
.briciole{display:flex;flex-wrap:wrap;align-items:center;gap:2px;flex:1;min-width:0}
.briciole button{border:0;background:transparent;color:var(--soft);font-weight:600;padding:5px 8px;border-radius:8px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.briciole button:hover{background:var(--hover);color:var(--text)}
.briciole button:last-child{color:var(--text)}
.briciole i{color:var(--muted);font-style:normal}
#a-cerca{width:280px;min-height:38px;padding:7px 12px;font-size:14px}
.tab{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column;min-height:200px}
.tab .rg{display:grid;grid-template-columns:34px minmax(0,1fr) 110px 110px 150px;align-items:center;gap:8px;padding:0 12px;min-height:36px}
.tab .th{background:var(--panel2);border-bottom:1px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:700}
.tab .th button{border:0;background:transparent;color:inherit;font:inherit;text-align:left;padding:8px 0;cursor:pointer}
.tab .th button.on{color:var(--text)}
.tab .corpo{overflow-y:auto;max-height:calc(100vh - 330px);min-height:120px}
.tab .corpo::-webkit-scrollbar{width:10px}.tab .corpo::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:3px solid var(--panel)}
.tab .r{border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);cursor:default}
.tab .r:hover{background:var(--hover)}
.tab .r.sel{background:color-mix(in srgb,var(--a3) 14%,var(--panel))}
.tab .r .n{display:flex;align-items:center;gap:9px;min-width:0}
.tab .r .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .r .n small{color:var(--muted);margin-left:6px}
.tab .num{text-align:right;color:var(--soft);font-size:13px;white-space:nowrap}
.tab .dt{color:var(--muted);font-size:12.5px;white-space:nowrap}
.tab input[type=checkbox]{width:16px;height:16px;accent-color:var(--a3);margin:0}
.tab .vuoto{padding:30px;text-align:center;color:var(--muted)}
.piccolo{font-size:12.5px;margin:0}
/* finestra di conferma */
#modale{position:fixed;inset:0;background:rgba(7,8,13,.78);display:none;place-items:center;z-index:70;padding:20px}
#modale.on{display:grid}
#modale .box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px 26px;max-width:520px;display:flex;flex-direction:column;gap:14px}
#modale p{margin:0;color:var(--soft);line-height:1.55}
/* finestrella dal tasto destro */
body.mini header,body.mini footer,body.mini #v-home{display:none!important}
body.mini main{padding:18px 22px}
body.mini .view{gap:12px}
body.mini h1{font-size:22px}
body.mini .perc{font-size:32px}
body.mini .grande{width:56px;height:56px;border-radius:16px}
body.mini .grande svg{width:28px;height:28px}
body.mini .centro{padding-top:6px}
body.mini .percorso{font-size:12px;padding:8px 10px}
footer .sep{width:1px;height:28px;background:var(--line);margin:0 6px}
/* schede della schermata iniziale illuminate mentre trascini */
.card{transition:border-color .2s,background-color .2s,transform .22s cubic-bezier(.2,.8,.3,1.2),box-shadow .22s,opacity .2s}
.card .lascia{position:absolute;left:26px;right:26px;bottom:26px;min-height:46px;display:none;align-items:center;justify-content:center;gap:10px;border-radius:12px;border:2px dashed var(--line);color:var(--soft);font-family:var(--display);font-weight:700;font-size:15px}
body.trascino .card .row{visibility:hidden}
body.trascino .card .lascia{display:flex}
body.trascino .card{border-style:dashed}
body.trascino .card:not(.accesa){opacity:.62}
body.trascino .card.accesa{border-style:solid}
.card.c.accesa{--k:var(--a3)}.card.e.accesa{--k:var(--a1)}
.card.accesa{border:1.5px solid var(--k);background:color-mix(in srgb,var(--k) 11%,var(--panel));transform:translateY(-4px) scale(1.012);box-shadow:0 0 0 4px color-mix(in srgb,var(--k) 20%,transparent),0 22px 60px -18px color-mix(in srgb,var(--k) 60%,transparent)}
.card.accesa .glow{opacity:.8;animation:respiro 1.6s ease-in-out infinite}
.card.accesa .ico{background:color-mix(in srgb,var(--k) 26%,var(--panel));animation:salto 1s ease-in-out infinite}
.card.accesa .lascia{border-style:solid;border-color:var(--k);background:var(--k);color:#04101C}
@keyframes respiro{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes salto{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.card.accesa,.card.accesa .glow,.card.accesa .ico{animation:none;transform:none}}
/* due strumenti in più nella schermata iniziale */
.tile{display:flex;gap:14px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 18px;transition:border-color .15s,background .15s}
.tile:hover{border-color:color-mix(in srgb,var(--a4) 55%,var(--line));background:var(--hover)}
.tile .ti{width:46px;height:46px;border-radius:13px;background:color-mix(in srgb,var(--a4) 15%,var(--panel));display:grid;place-items:center;flex:none}
.tile b{display:block;font-family:var(--display);font-size:16px;margin-bottom:3px}
.tile span{color:var(--muted);font-size:13px;line-height:1.4}
.tile .fr{margin-left:auto;color:var(--muted);font-size:20px}
/* vista Esplora */
main.pieno{padding:14px 18px 12px;overflow:hidden}
main.pieno .view.on{height:100%}
#v-esplora{max-width:none;gap:10px}
.attrezzi{display:flex;gap:2px;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:5px;overflow-x:auto;flex:none}
.attrezzi::-webkit-scrollbar{height:6px}.attrezzi::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.attrezzi button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:7px 8px;border-radius:11px;min-width:74px;color:var(--soft);font-size:12.5px;font-weight:600;white-space:nowrap;transition:background .12s,color .12s}
.attrezzi button svg{width:26px;height:26px;stroke:var(--a4);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.attrezzi button.rischio svg{stroke:var(--red)}
.attrezzi button:hover:not(:disabled){background:var(--hover);color:var(--text)}
.attrezzi button:disabled{opacity:.33;cursor:default}
.attrezzi .sep{width:1px;background:var(--line);margin:8px 5px;flex:none}
.attrezzi .spazio{flex:1}
.indirizzo{display:flex;gap:8px;align-items:center;flex:none}
.tondo{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;flex:none;padding:0}
.tondo:hover:not(:disabled){background:var(--hover)}
.tondo:disabled{opacity:.35;cursor:default}
.tondo svg{width:19px;height:19px;stroke:var(--soft);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.campo-ico{position:relative;display:flex;align-items:center}
.campo-ico svg{position:absolute;left:12px;width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2.2;pointer-events:none}
#x-indirizzo{flex:1;min-height:40px;padding:7px 12px 7px 38px;font-size:14px;border-radius:11px}
#x-trova{width:250px;min-height:40px;padding:7px 12px 7px 36px;font-size:14px;border-radius:11px}
.esp-corpo{flex:1;min-height:0;display:grid;grid-template-columns:188px minmax(0,1fr);gap:10px}
.luoghi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;overflow-y:auto}
.luoghi h3{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin:10px 9px 5px;font-weight:700}
.luoghi h3:first-child{margin-top:4px}
.luoghi button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;padding:7px 9px;border-radius:9px;text-align:left;color:var(--soft);font-size:13.5px;min-width:0}
.luoghi button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.luoghi button small{color:var(--muted);font-size:11.5px;margin-left:auto;flex:none}
.luoghi button:hover{background:var(--hover);color:var(--text)}
.luoghi button.on{background:color-mix(in srgb,var(--a4) 14%,var(--panel));color:var(--text)}
.luoghi svg{width:17px;height:17px;flex:none}
.esp-lista{display:flex;flex-direction:column;min-height:0;gap:8px}
.tab.esp{flex:1;min-height:0}
.tab.esp .rg{grid-template-columns:minmax(0,1fr) 104px 150px 142px;gap:10px;padding:0 14px}
.tab.esp .corpo{flex:1;max-height:none;outline:none}
.tab.esp .r{min-height:34px}
.tab.esp .r.sel{background:color-mix(in srgb,var(--a4) 15%,var(--panel))}
.tab.esp .r.sel.fuoco{box-shadow:inset 3px 0 0 var(--a4)}
.tab.esp .tp{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.esp .r.nasc{opacity:.6}
.th button .fr{margin-left:4px;font-size:10px;color:var(--a4)}
.banner{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--a4) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--a4) 35%,var(--line));border-radius:12px;padding:7px 8px 7px 14px;font-size:13.5px;color:var(--soft);flex:none}
.banner b{color:var(--text)}
.banner .btn{min-height:32px;padding:5px 12px;font-size:13px;margin-left:auto;border-radius:9px}
.stato{display:flex;gap:16px;align-items:center;color:var(--muted);font-size:12.5px;padding:0 4px;flex:none;min-height:22px}
.stato b{color:var(--soft);font-weight:600}
.stato label{margin-left:auto;display:flex;align-items:center;gap:7px;cursor:pointer}
.stato input{accent-color:var(--a4);margin:0}
.giro{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--a4);border-radius:50%;animation:gira .8s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes gira{to{transform:rotate(360deg)}}
/* menu del tasto destro nell'elenco */
#ctx{position:fixed;z-index:80;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:5px;min-width:220px;box-shadow:0 18px 44px rgba(0,0,0,.55);display:none}
#ctx.on{display:block}
#ctx button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:8px;text-align:left;font-size:13.5px;color:var(--text)}
#ctx button:hover:not(:disabled){background:var(--hover)}
#ctx button:disabled{opacity:.35;cursor:default}
#ctx button svg{width:17px;height:17px;stroke:var(--a4);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#ctx button.rischio svg{stroke:var(--red)}
#ctx hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
/* finestra Info */
.dati{display:grid;grid-template-columns:auto 1fr;gap:7px 18px;font-size:14px;margin:0}
.dati dt{color:var(--muted)}
.dati dd{margin:0;color:var(--text);word-break:break-all;user-select:text}
#modale .box{min-width:min(440px,90vw)}
#m-ico{width:52px;height:52px;border-radius:15px;display:none;place-items:center}
#m-ico.on{display:grid}
#m-ico.ok{background:color-mix(in srgb,var(--a1) 16%,var(--panel))}
#m-ico.ko{background:color-mix(in srgb,var(--red) 16%,var(--panel))}
#m-ico.am{background:color-mix(in srgb,var(--a4) 16%,var(--panel))}
.btn.ambra{background:var(--a4);color:#1A1206}
.btn.ambra:hover{filter:brightness(1.07)}
/* procedura guidata */
#v-guida{gap:14px;max-width:940px}
#v-guida h1{font-size:28px}
.g-area{flex:1;min-height:0;overflow-y:auto;padding:2px 6px 4px 2px;margin-right:-6px}
.g-area::-webkit-scrollbar{width:10px}.g-area::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:3px solid var(--bg)}
.passi{display:flex;gap:8px}
.passo{flex:1;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:13.5px;min-width:0}
.passo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.passo i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--track);font-style:normal;font-weight:700;flex:none;font-size:13px}
.passo.on{border-color:var(--a4);color:var(--text)}
.passo.on i{background:var(--a4);color:#1A1206}
.passo.fatto i{background:color-mix(in srgb,var(--a4) 30%,var(--panel));color:var(--text)}
.g-passo{display:none;flex-direction:column;gap:16px}
.g-passo.on{display:flex}
.opzioni2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opz{display:flex;gap:16px;align-items:flex-start;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:20px}
.opz:hover{background:var(--hover)}
.opz .ico{margin:0;width:54px;height:54px;flex:none}
.opz b{display:block;font-family:var(--display);font-size:19px;margin-bottom:6px}
.opz span{color:var(--muted);font-size:13.5px;line-height:1.5}
.opz.c .ico{background:color-mix(in srgb,var(--a3) 18%,var(--panel))}
.opz.e .ico{background:color-mix(in srgb,var(--a1) 15%,var(--panel))}
.opz.c.on{border-color:var(--a3);background:color-mix(in srgb,var(--a3) 10%,var(--panel))}
.opz.e.on{border-color:var(--a1);background:color-mix(in srgb,var(--a1) 9%,var(--panel))}
.zona-drop{border:2px dashed var(--line);border-radius:18px;padding:18px 20px;display:flex;align-items:center;gap:16px;transition:border-color .15s,background .15s}
.zona-drop.sopra{border-color:var(--a4);background:color-mix(in srgb,var(--a4) 8%,transparent)}
.zona-drop p{margin:0;color:var(--soft);flex:1;line-height:1.5}
.zona-drop svg{flex:none}
#g-lista{max-height:220px}
.g-vuota{color:var(--muted);text-align:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.formati.g{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.formati.g .fmt{padding:9px 12px;gap:10px}
.formati.g .fmt b{font-size:14.5px;margin-bottom:2px}
.formati.g .fmt span{font-size:12.5px}
.scelte{display:flex;flex-direction:column;gap:8px}
.scelta{display:flex;align-items:center;gap:10px;color:var(--soft);cursor:pointer;font-size:14.5px}
.scelta input{accent-color:var(--a4);width:17px;height:17px;margin:0}
.scelta .dove{flex:1;min-width:0}
.riga2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g-nota{color:var(--muted);font-size:13px;line-height:1.5;display:flex;gap:9px;align-items:flex-start}
.g-nota svg{flex:none;margin-top:1px}
select.sel{background:var(--panel2);color:inherit;border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit}
.g-piede{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px;flex:none}
.g-piede .sp{flex:1}
@media (max-height:780px){main{padding-top:22px}#v-home{gap:16px}#v-home h1{font-size:30px}#v-home .card{padding:22px 24px}#v-home .ico{width:54px;height:54px;margin-bottom:14px}#v-home .card h2{margin-bottom:8px}#v-home .card p{margin-bottom:18px}.card .lascia{left:24px;right:24px;bottom:22px}.tile{padding:10px 16px}.tile .ti{width:42px;height:42px}#v-home .nota{padding:11px 18px;font-size:13.5px}}
@media (max-height:640px){main{padding-top:18px}h1{font-size:28px}.ico{width:52px;height:52px;margin-bottom:14px}.card{padding:20px}}
</style>
</head>

<script>
"use strict";
const $ = id => document.getElementById(id);
const S = {
  lingua: "it", testi: {}, lingue: [], formato: "zip",
  lista: [],          // file e cartelle da comprimere
  coda: [], codaTot: 0, codaFatti: 0, ultimoEstratto: null,
  corrente: null,     // archivio che sto estraendo
  tipo: "",           // "comprimi" o "estrai" (lavoro in corso)
  dropDove: "auto", vista: "home", occupato: false,
  arch: null,         // archivio aperto nella vista
  riprova: null,      // cosa rifare quando arriva la password
  daVista: false,     // il lavoro è partito dalla vista dell'archivio
  modoEstrai: "",     // "", "qui", "cartella"
  destinazione: "",   // "Estrai in...": la cartella scelta ("" = accanto all'archivio)
  pwElenco: "",
  ritorno: "",        // da dove sono partito: "esplora", "guida" o "" (schermata iniziale)
  formati: ["zip", "7z"],
};

function t(k, v) {
  let s = (S.testi[S.lingua] || {})[k] ?? (S.testi.en || {})[k] ?? (S.testi.it || {})[k] ?? k;
  if (v) for (const [a, b] of Object.entries(v)) s = s.split("{" + a + "}").join(b);
  return s;
}
function applicaTesti() {
  document.documentElement.lang = S.lingua;
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = t(e.dataset.t); });
  document.querySelectorAll("[data-tp]").forEach(e => { e.placeholder = t(e.dataset.tp); });
  if (S.vista === "archivio") disegnaArchivio();
  if (INIZIO.mini) $("f-ok").textContent = t("chiudi");
  document.querySelectorAll("#lingue button").forEach(b => b.classList.toggle("on", b.dataset.l === S.lingua));
  $("lingue").setAttribute("aria-label", t("lingua"));
  if (S.vista === "comprimi") disegnaLista();
  document.querySelectorAll("[data-tt]").forEach(e => { e.title = t(e.dataset.tt); e.setAttribute("aria-label", t(e.dataset.tt)); });
  if (X.el) { disegnaLuoghi(); disegnaEsplora(); }
  if (S.vista === "guida") disegnaGuida();
}
function dim(n) {
  const f = new Intl.NumberFormat(S.lingua, { maximumFractionDigits: 1 });
  if (n < 1024) return f.format(n) + " B";
  const u = ["KB", "MB", "GB", "TB"]; let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return f.format(n) + " " + u[i];
}
function vista(v) {
  S.vista = v;
  if (v === "home") S.ritorno = "";
  document.querySelector("main").classList.toggle("pieno", v === "esplora" || v === "guida");
  chiudiCtx();
  document.querySelectorAll(".view").forEach(e => e.classList.toggle("on", e.id === "v-" + v));
  document.querySelector("main").scrollTop = 0;
}
let toastT = 0;
function toast(s) {
  const e = $("toast"); e.textContent = s; e.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove("on"), 3200);
}
function nomeFile(p) { return p.split(/[\\/]/).filter(Boolean).pop() || p; }
function cartellaDi(p) { const i = Math.max(p.lastIndexOf("\\"), p.lastIndexOf("/")); return i > 0 ? p.slice(0, i) : p; }

// ---------- COMPRIMI ----------
async function aggiungi(percorsi) {
  if (!percorsi || !percorsi.length) return;
  const info = await goInfo(percorsi);
  const visti = new Set(S.lista.map(e => e.percorso.toLowerCase()));
  for (const e of info || []) if (!visti.has(e.percorso.toLowerCase())) { S.lista.push(e); visti.add(e.percorso.toLowerCase()); }
  if (!S.lista.length) return;
  $("c-nome").dataset.toccato = $("c-nome").dataset.toccato || "";
  vista("comprimi");
  disegnaLista();
}
function nomeProposto() {
  if (S.lista.length === 1) {
    const e = S.lista[0];
    if (e.cartella) return e.nome;
    const n = e.nome.replace(/\.(tar\.(gz|bz2|xz)|[^.]{1,12})$/i, "");
    return n || e.nome;
  }
  return t("nome_multiplo");
}
function disegnaLista() {
  const l = $("c-lista"); l.textContent = "";
  let tot = 0;
  S.lista.forEach((e, i) => {
    tot += e.dim || 0;
    const r = document.createElement("div"); r.className = "el";
    r.innerHTML = e.cartella
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFB547" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B91A7" stroke-width="2"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';
    const n = document.createElement("span"); n.className = "n"; n.textContent = e.nome; n.title = e.percorso;
    const d = document.createElement("span"); d.className = "d"; d.textContent = e.cartella ? "" : dim(e.dim);
    const b = document.createElement("button"); b.textContent = t("togli");
    b.onclick = () => { S.lista.splice(i, 1); if (!S.lista.length) { vista("home"); return; } disegnaLista(); };
    r.append(n, d, b); l.append(r);
  });
  const n = S.lista.length;
  $("c-conta").textContent = (n === 1 ? t("scelti_1") : t("scelti_n", { n })) + (tot ? " · " + dim(tot) : "");
  if (!$("c-nome").dataset.toccato) $("c-nome").value = nomeProposto();
  document.querySelectorAll("#v-comprimi .fmt").forEach(b => b.classList.toggle("on", b.dataset.f === S.formato));
  aggiornaDove();
}
const ESTENSIONI = { "7z": ".7z", zip: ".zip", tarzst: ".tar.zst", tarxz: ".tar.xz" };
function aggiornaDove() {
  const est = ESTENSIONI[S.formato] || ".zip";
  $("c-livello-riga").style.display = S.formato === "7z" ? "" : "none";
  $("c-livello").value = S.livello || "massima";
  const dove = S.lista.length ? S.lista[0].dove : "";
  $("c-dove").textContent = t("salva_in") + ": " + dove + "\\" + ($("c-nome").value.trim() || nomeProposto()) + est;
  $("c-dove").title = $("c-dove").textContent;
}
async function comprimi() {
  if (!S.lista.length) return;
  const nome = $("c-nome").value.trim();
  const r = await goComprimi(S.lista.map(e => e.percorso), S.formato, nome === nomeProposto() && !$("c-nome").dataset.toccato ? "" : nome, S.livello || "massima", "");
  if (r === "occupato") { toast(t("err_occupato")); return; }
  if (r !== "ok") return;
  S.daVista = false;
  S.tipo = "comprimi"; inizioLavoro(t("lavoro_comprimo"), "");
}

// ---------- ESTRAI ----------
function estraiTutti(percorsi, dest, modo) {
  const nuovi = (percorsi || []).filter(Boolean);
  if (!nuovi.length) return;
  if (S.occupato && S.tipo === "estrai") { S.coda.push(...nuovi); S.codaTot += nuovi.length; aggiornaCoda(); return; }
  if (S.occupato) { toast(t("err_occupato")); return; }
  S.coda = nuovi.slice(); S.codaTot = nuovi.length; S.codaFatti = 0; S.ultimoEstratto = null; S.daVista = false;
  S.destinazione = dest || "";
  if (modo !== undefined) S.modoEstrai = modo || "";
  prossimo();
}
function aggiornaCoda() {
  $("l-coda").textContent = S.codaTot > 1 ? t("lavoro_coda", { i: Math.min(S.codaFatti + 1, S.codaTot), n: S.codaTot }) : "";
}
async function prossimo(password) {
  if (password === undefined) {
    if (!S.coda.length) { finisciCoda(); return; }
    S.corrente = S.coda.shift();
  }
  S.riprova = pw => prossimo(pw);
  const r = S.destinazione ? await goEstraiIn(S.corrente, password || "", S.destinazione, S.modoEstrai || "")
                           : await goEstrai(S.corrente, password || "", S.modoEstrai || "");
  if (r === "occupato") { toast(t("err_occupato")); return; }
  S.tipo = "estrai";
  inizioLavoro(t("lavoro_estraggo"), nomeFile(S.corrente));
  aggiornaCoda();
}
function finisciCoda() {
  S.occupato = false;
  const r = S.ultimoEstratto;
  if (!r) { if (S.ritorno === "esplora") tornaEsplora(); else if (S.ritorno === "guida") vista("guida"); else vista("home"); return; }
  mostraFatto(r, S.codaFatti > 1 ? S.codaFatti : 0);
}

// ---------- LAVORO ----------
function inizioLavoro(titolo, nome) {
  S.occupato = true;
  $("l-titolo").textContent = titolo;
  $("l-perc").textContent = "0%";
  $("l-barra").classList.add("indef");
  $("l-barra").querySelector("i").style.width = "0";
  $("l-nome").textContent = nome || "";
  $("l-annulla").disabled = false; $("l-annulla").textContent = t("annulla");
  if (S.tipo !== "estrai") $("l-coda").textContent = "";
  vista("lavoro");
}
const tz = window.tz = {
  avanza(a) {
    if (S.vista !== "lavoro") return;
    if (a.totale > 0) {
      const p = Math.max(0, Math.min(100, Math.floor(a.fatto * 100 / a.totale)));
      $("l-barra").classList.remove("indef");
      $("l-barra").querySelector("i").style.width = p + "%";
      $("l-perc").textContent = p + "%";
    }
    if (a.nome) $("l-nome").textContent = a.nome;
  },
  fine(r) {
    if (r.tipo === "estrai") {
      S.codaFatti++; S.ultimoEstratto = r;
      if (S.coda.length) { prossimo(); return; }
      finisciCoda(); return;
    }
    S.occupato = false;
    S.lista = []; $("c-nome").dataset.toccato = "";
    mostraFatto(r, 0);
  },
  errore(e) {
    if (S.riprova && (e.codice === "password" || e.codice === "password_sbagliata")) {
      chiediPassword(e.codice === "password_sbagliata"); return;
    }
    S.occupato = e.tipo === "estrai" && S.coda.length > 0;
    mostraErrore(e);
  },
  trascinati(p) { arrivati(p, S.dropDove); },
  aggiunti(p) { arrivati(p, INIZIO.modo || "auto"); },
  elenco(r) {
    S.occupato = false;
    const el = r.elenco || {};
    S.arch = { percorso: r.percorso, password: S.pwElenco || "", el, albero: costruisciAlbero(el.voci || []),
      cartella: "", sel: new Set(), ordine: "nome", dir: 1, cerca: "" };
    $("a-cerca").value = "";
    vista("archivio"); disegnaArchivio();
  },
  aperto(r) {
    S.occupato = false;
    vista("archivio");
    toast(t("aperto", { nome: nomeFile(r.nome) }));
  },
  cartella(r) { esploraArrivata(r); },
  trovati(r) { trovaArrivata(r); },
  info(r) { infoArrivata(r); },
  verificato(r) { verificaArrivata(r); },
};
function mostraFatto(r, quanti) {
  $("f-titolo").textContent = r.tipo === "comprimi" ? t("fatto_comprimi") : r.tipo === "ripara" ? t("fatto_ripara") : t("fatto_estrai");
  if (r.tipo === "ripara") {
    $("f-dettagli").textContent = t("fatto_ripara_d", { n: r.file });
    $("f-apri").textContent = t("mostra_file");
  } else if (r.tipo === "comprimi") {
    const perc = r.originale > 0 ? Math.max(0, Math.round((1 - r.compresso / r.originale) * 100)) : 0;
    $("f-dettagli").textContent = t("fatto_dettagli_c", { file: r.file, orig: dim(r.originale), comp: dim(r.compresso), perc: perc + "%" });
    $("f-apri").textContent = t("mostra_file");
  } else {
    $("f-dettagli").textContent = quanti ? t("fatto_coda", { n: quanti }) : t("fatto_dettagli_e", { file: r.file });
    $("f-apri").textContent = t("apri_cartella");
  }
  if (r.tipo === "estrai" && r.qui && !quanti) $("f-dettagli").textContent = t("fatto_dettagli_q", { file: r.file });
  $("f-ok").textContent = INIZIO.mini ? t("chiudi") : (S.daVista && S.arch ? t("torna_archivio") : S.ritorno === "esplora" ? t("torna_esplora") : t("nuovo"));
  if (S.ritorno === "guida") $("f-apri").textContent = t("apri_cartella");
  $("f-percorso").textContent = r.percorso;
  const avvisi = [];
  if (r.rinominati) avvisi.push(t("rinominati", { n: r.rinominati }));
  if (r.riserva) avvisi.push(t("riserva"));
  $("f-avvisi").textContent = avvisi.join(" ");

  if (S.vista === "guida" && dove !== "estrai-in") { guidaAggiungi(percorsi); return; }
  if (dove === "estrai-in") {
    const d = await goScegliDestinazione();
    if (!d || !d.length) { if (INIZIO.mini) goChiudi(); return; }
    estraiTutti(percorsi, d[0], ""); return;
  }

  const info = await goInfo(percorsi);
  const archivi = (info || []).filter(e => e.archivio).map(e => e.percorso);
  if (dove === "estrai") {
    const altri = (info || []).filter(e => !e.archivio).map(e => e.percorso);

      return;
    }

    estraiTutti(archivi, ""); return;
  }
  // automatico: se sono tutti archivi li estraggo, altrimenti li comprimo
  if (archivi.length && archivi.length === (info || []).length) estraiTutti(archivi, "", S.modoEstrai);
  else aggiungi(percorsi);
}

    const src = document.querySelector('#x-attrezzi [data-a="' + a + '"] svg');
    b.innerHTML = src ? src.outerHTML : "";
    const sp = document.createElement("span"); sp.textContent = t(k); b.append(sp);
    b.disabled = !!dis; if (rischio) b.classList.add("rischio");
    b.onclick = () => azione(a);
    c.append(b);
  };
  const arch = s.filter(v => v.archivio);
  voce("apri", s[0] && s[0].cartella ? "x_entra" : "x_apri", s.length !== 1);
  c.append(document.createElement("hr"));
  voce("comprimi", "x_comprimi_ctx", !s.length);
  voce("estrai", "x_estrai", !arch.length);
  voce("verifica", "x_verifica", arch.length !== 1 || s.length !== 1);
  if (s.length === 1 && s[0].ext === "zip") voce("ripara", "x_ripara");
  voce("info", "x_info", !s.length);
  c.append(document.createElement("hr"));
  const b = document.createElement("button");
  b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M14 13h-5M11.5 10.5 14 13l-2.5 2.5"/></svg>';
  const sp = document.createElement("span"); sp.textContent = t("x_mostra"); b.append(sp);
  b.disabled = s.length !== 1; b.onclick = () => azione("mostra"); c.append(b);
  voce("elimina", "x_elimina_ctx", !s.length, true);
  c.classList.add("on");
  const w = c.offsetWidth, h = c.offsetHeight;
  c.style.left = Math.min(x, window.innerWidth - w - 8) + "px";
  c.style.top = Math.min(y, window.innerHeight - h - 8) + "px";
}
// ----- eventi della vista -----
$("x-corpo").addEventListener("mousedown", e => {
  const r = e.target.closest(".r"); if (!r) return;
  const i = +r.dataset.i;
  if (e.button === 2) { if (!X.sel.has(righeEsplora()[i].percorso)) scegliIndice(i, null); return; }
  if (e.button === 0) scegliIndice(i, e);
});
$("x-corpo").addEventListener("dblclick", e => {
  const r = e.target.closest(".r"); if (!r) return;
  apriVoceEsplora(righeEsplora()[+r.dataset.i]);
});
$("x-corpo").addEventListener("contextmenu", e => {
  e.preventDefault();
  if (!e.target.closest(".r")) { X.sel.clear(); ridisegnaSelezione(); }
  apriCtx(e.clientX, e.clientY);
});
$("x-corpo").addEventListener("click", e => { if (!e.target.closest(".r")) { X.sel.clear(); X.fuoco = -1; ridisegnaSelezione(); } });
document.addEventListener("mousedown", e => { if (!e.target.closest("#ctx")) chiudiCtx(); });
window.addEventListener("blur", chiudiCtx);
$("x-corpo").addEventListener("keydown", e => {
  const righe = righeEsplora();
  const muovi = n => {
    if (!righe.length) return;
    const i = Math.max(0, Math.min(righe.length - 1, (X.fuoco < 0 ? -1 : X.fuoco) + n));
    if (e.shiftKey) { X.fuoco = i; X.sel.clear(); const [a, b] = X.ancora < i ? [Math.max(0, X.ancora), i] : [i, X.ancora]; for (let k = a; k <= b; k++) X.sel.add(righe[k].percorso); ridisegnaSelezione(); }
    else scegliIndice(i, null);
    mostraRiga(i); e.preventDefault();
  };
  if (e.key === "ArrowDown") muovi(1);
  else if (e.key === "ArrowUp" && !e.altKey) muovi(-1);
  else if (e.key === "PageDown") muovi(15);
  else if (e.key === "PageUp") muovi(-15);
  else if (e.key === "Home") muovi(-1e9);
  else if (e.key === "End") muovi(1e9);
  else if (e.key === "Enter") { if (X.sel.size === 1) apriVoceEsplora(selezionate()[0]); e.preventDefault(); }
  else if (e.key === "Delete") { azione("elimina"); e.preventDefault(); }
  else if (e.key === "Backspace" || (e.key === "ArrowUp" && e.altKey)) { $("x-su").click(); e.preventDefault(); }
  else if ((e.key === "a" || e.key === "A") && e.ctrlKey) { for (const v of righe) X.sel.add(v.percorso); ridisegnaSelezione(); e.preventDefault(); }
  else if (e.key === "F5") { apriCartella(X.el.percorso); e.preventDefault(); }
  else if (e.key === "ContextMenu") { const r = $("x-corpo").querySelector(".r.fuoco") || $("x-corpo"); const b = r.getBoundingClientRect(); apriCtx(b.left + 40, b.top + 20); e.preventDefault(); }
});
document.querySelectorAll("#v-esplora .th button").forEach(b => b.onclick = () => {
  if (X.ordine === b.dataset.o) X.dir = -X.dir; else { X.ordine = b.dataset.o; X.dir = b.dataset.o === "nome" || b.dataset.o === "tipo" ? 1 : -1; }
  const sel = new Set(X.sel);
  if (X.trova) {

  } else ordinaVoci();
  X.sel = sel; X.fuoco = X.ancora = -1; disegnaEsplora();

document.querySelectorAll("#x-attrezzi button").forEach(b => b.onclick = () => azione(b.dataset.a));
$("x-su").onclick = () => {
  if (X.trova) { chiudiTrova(); return; }
  if (X.el && X.el.padre) apriCartella(X.el.padre, nomeFile(X.el.percorso));
};
$("x-aggiorna").onclick = () => { if (X.el) apriCartella(X.el.percorso); };

};

};
$("x-banner-b").onclick = () => chiudiTrova();
$("x-nascosti").onchange = () => { X.nascosti = $("x-nascosti").checked; if (X.el) apriCartella(X.el.percorso); };
$("b-esplora").onclick = apriEsplora;

// ---------- PROCEDURA GUIDATA ----------
const G = { passo: 1, cosa: "", lista: [], formato: "zip", livello: "massima", doveC: "", doveE: "", nomeToccato: false };
const LIVELLO_FORMATI = { "7z": 1, targz: 1, tarbz2: 1, tarxz: 1, tarzst: 1 };
function apriGuida() {
  S.ritorno = "guida";
  G.passo = 1; G.cosa = ""; G.lista = []; G.formato = "zip"; G.doveC = ""; G.doveE = ""; G.nomeToccato = false;
  $("g-nome").value = "";
  document.querySelector('input[name="g-dove-c"][value="accanto"]').checked = true;
  document.querySelector('input[name="g-dove-e"][value="accanto"]').checked = true;
  document.querySelector('input[name="g-modo"][value=""]').checked = true;
  $("g-livello").value = S.livello || "massima";
  vista("guida"); disegnaGuida();
}
function nomeGuida() {
  if (G.lista.length === 1) { const e = G.lista[0]; return e.cartella ? e.nome : (e.nome.replace(/\.(tar\.(gz|bz2|xz|zst)|[^.]{1,12})$/i, "") || e.nome); }
  return t("nome_multiplo");
}
function disegnaGuida() {
  document.querySelectorAll(".passo").forEach(p => { const n = +p.dataset.p; p.classList.toggle("on", n === G.passo); p.classList.toggle("fatto", n < G.passo); });
  document.querySelectorAll(".g-passo").forEach(p => p.classList.remove("on"));
  if (G.passo === 3) $(G.cosa === "estrai" ? "g3e" : "g3c").classList.add("on");
  else document.querySelector('.g-passo[data-p="' + G.passo + '"]').classList.add("on");
  document.querySelectorAll(".opz").forEach(o => o.classList.toggle("on", o.dataset.g === G.cosa));
  // passo 2
  const est = G.cosa === "estrai";
  $("g2-tit").textContent = est ? t("g_scegli_archivi") : t("g_scegli_file");
  $("g-zona-t").textContent = est ? t("g_trascina_archivi") : t("g_trascina_file");
  $("g-sfoglia-f").textContent = est ? t("g_sfoglia_archivi") : t("g_sfoglia_file");
  $("g-sfoglia-c").hidden = est;
  const l = $("g-lista"); l.textContent = "";
  let tot = 0;
  G.lista.forEach((e, i) => {
    tot += e.dim || 0;
    const r = document.createElement("div"); r.className = "el";
    r.innerHTML = e.cartella ? ICONE_TIPO.cartella : e.archivio ? ICONE_TIPO.archivio : ICONE_TIPO.file;
    const n = document.createElement("span"); n.className = "n"; n.textContent = e.nome; n.title = e.percorso;
    const d = document.createElement("span"); d.className = "d"; d.textContent = e.cartella ? "" : dim(e.dim);
    const b = document.createElement("button"); b.textContent = t("togli");
    b.onclick = () => { G.lista.splice(i, 1); disegnaGuida(); };
    r.append(n, d, b); l.append(r);
  });
  if (!G.lista.length) { const v = document.createElement("div"); v.className = "g-vuota"; v.textContent = t("g_niente"); l.append(v); }
  $("g-conta").textContent = G.lista.length ? (G.lista.length === 1 ? t("scelti_1") : t("scelti_n", { n: G.lista.length })) + (tot ? " · " + dim(tot) : "") : "";
  // passo 3 comprimi
  const box = $("g-formati");
  if (!box.children.length || box.dataset.lingua !== S.lingua) {
    box.textContent = ""; box.dataset.lingua = S.lingua;
    for (const f of S.formati) {
      const b = document.createElement("button"); b.className = "fmt"; b.dataset.f = f;
      b.innerHTML = '<i class="pt"></i><div><b></b><span></span></div>';
      b.querySelector("b").textContent = t("gf_" + f); b.querySelector("span").textContent = t("gf_" + f + "_d");
      b.onclick = () => { G.formato = f; disegnaGuida(); };
      box.append(b);
    }
  }
  box.querySelectorAll(".fmt").forEach(b => b.classList.toggle("on", b.dataset.f === G.formato));
  $("g-livello-box").style.visibility = LIVELLO_FORMATI[G.formato] ? "" : "hidden";
  if (!G.nomeToccato) $("g-nome").value = G.lista.length ? nomeGuida() : "";
  $("g-dove-c-t").textContent = G.doveC; $("g-dove-c-t").title = G.doveC;
  $("g-dove-e-t").textContent = G.doveE; $("g-dove-e-t").title = G.doveE;
  // piede
  $("g-indietro").hidden = G.passo === 1;
  $("g-avanti").textContent = G.passo === 3 ? (est ? t("g_prosegui_e") : t("g_prosegui_c")) : t("g_avanti");
  $("g-avanti").disabled = (G.passo === 1 && !G.cosa) || (G.passo === 2 && !G.lista.length);
}
async function guidaAggiungi(percorsi) {
  if (!percorsi || !percorsi.length) return;
  if (G.passo === 1) { G.cosa = G.cosa || "comprimi"; G.passo = 2; }
  const info = await goInfo(percorsi) || [];
  const visti = new Set(G.lista.map(e => e.percorso.toLowerCase()));
  let scartati = 0;
  for (const e of info) {
    if (G.cosa === "estrai" && !e.archivio) { scartati++; continue; }
    if (!visti.has(e.percorso.toLowerCase())) { G.lista.push(e); visti.add(e.percorso.toLowerCase()); }
  }
  if (scartati) toast(t("non_archivi_alcuni", { n: scartati }));
  disegnaGuida();
}
async function guidaProsegui() {
  if (G.passo < 3) { G.passo++; disegnaGuida(); return; }
  if (S.occupato) { toast(t("err_occupato")); return; }
  const p = G.lista.map(e => e.percorso);
  if (G.cosa === "estrai") {
    const altra = document.querySelector('input[name="g-dove-e"]:checked').value === "altra";
    if (altra && !G.doveE) { await scegliDoveG("e"); if (!G.doveE) return; }
    const modo = document.querySelector('input[name="g-modo"]:checked').value;
    S.ritorno = "guida";
    estraiTutti(p, altra ? G.doveE : "", modo);
    return;
  }
  const altra = document.querySelector('input[name="g-dove-c"]:checked').value === "altra";
  if (altra && !G.doveC) { await scegliDoveG("c"); if (!G.doveC) return; }
  const nome = $("g-nome").value.trim();
  const r = await goComprimi(p, G.formato, G.nomeToccato || nome !== nomeGuida() ? nome : "", $("g-livello").value, altra ? G.doveC : "");
  if (r === "occupato") { toast(t("err_occupato")); return; }
  if (r !== "ok") return;
  S.ritorno = "guida"; S.daVista = false; S.lista = [];
  S.tipo = "comprimi"; inizioLavoro(t("lavoro_comprimo"), "");
}
async function scegliDoveG(k) {
  const d = await goScegliDestinazione();
  if (d && d.length) {
    if (k === "c") G.doveC = d[0]; else G.doveE = d[0];
    document.querySelector('input[name="g-dove-' + k + '"][value="altra"]').checked = true;
  }
  disegnaGuida();
}
document.querySelectorAll(".opz").forEach(o => o.onclick = () => {
  if (G.cosa !== o.dataset.g) G.lista = [];
  G.cosa = o.dataset.g; G.passo = 2; disegnaGuida();
});
$("g-avanti").onclick = guidaProsegui;
$("g-indietro").onclick = () => { if (G.passo > 1) { G.passo--; disegnaGuida(); } };
$("g-esci").onclick = () => { if (X.el && G.daEsplora) { S.ritorno = "esplora"; tornaEsplora(); } else vista("home"); };
$("g-sfoglia-f").onclick = async () => guidaAggiungi(G.cosa === "estrai" ? await goScegliArchivio() : await goScegliFile());
$("g-sfoglia-c").onclick = async () => guidaAggiungi(await goScegliCartella());
$("g-nome").oninput = () => { G.nomeToccato = true; };
$("g-dove-c-b").onclick = () => scegliDoveG("c");
$("g-dove-e-b").onclick = () => scegliDoveG("e");
$("b-guida").onclick = () => { apriGuida(); G.daEsplora = false; };

// ---------- pulsanti ----------
$("b-file").onclick = async () => aggiungi(await goScegliFile());
$("b-cartella").onclick = async () => aggiungi(await goScegliCartella());
$("c-piu-file").onclick = async () => aggiungi(await goScegliFile());
$("c-piu-cartella").onclick = async () => aggiungi(await goScegliCartella());
$("b-archivio").onclick = async () => estraiTutti(await goScegliArchivio(), "", "");
$("c-indietro").onclick = () => { S.lista = []; $("c-nome").dataset.toccato = ""; if (S.ritorno === "esplora") tornaEsplora(); else vista("home"); };
$("c-vai").onclick = comprimi;
$("c-nome").oninput = () => { $("c-nome").dataset.toccato = "1"; aggiornaDove(); };
$("c-nome").onkeydown = e => { if (e.key === "Enter") comprimi(); };
document.querySelectorAll("#v-comprimi .fmt").forEach(b => b.onclick = () => {
  S.formato = b.dataset.f; goFormato(S.formato);
  document.querySelectorAll("#v-comprimi .fmt").forEach(x => x.classList.toggle("on", x === b));
  aggiornaDove();
});
$("c-livello").onchange = () => { S.livello = $("c-livello").value; goLivello(S.livello); };
$("l-annulla").onclick = () => {
  S.coda = []; S.codaTot = 0;
  $("l-annulla").disabled = true; $("l-annulla").textContent = t("annullando");
  goAnnulla();
};
$("f-ok").onclick = () => {
  S.ultimoEstratto = null;
  if (INIZIO.mini) { goChiudi(); return; }
  if (S.daVista && S.arch) { vista("archivio"); return; }
  if (S.ritorno === "esplora") { tornaEsplora(true); return; }
  if (S.ritorno === "guida") { G.passo = 1; G.lista = []; if (G.daEsplora && X.el) { tornaEsplora(true); return; } }
  vista("home");
};
$("p-mostra").onclick = () => { const c = $("p-campo"); c.type = c.type === "password" ? "text" : "password"; c.focus(); };
$("p-vai").onclick = () => { const pw = $("p-campo").value; if (!pw) { $("p-campo").focus(); return; } (S.riprova || prossimo)(pw); };
$("p-campo").onkeydown = e => { if (e.key === "Enter") $("p-vai").click(); if (e.key === "Escape") $("p-annulla").click(); };
$("p-annulla").onclick = () => {
  if (S.coda.length) { prossimo(); return; }
  S.occupato = false;
  if (S.daVista && S.arch && S.tipo !== "elenco") { vista("archivio"); return; }
  if (INIZIO.mini && !S.ultimoEstratto) { goChiudi(); return; }
  if (S.ultimoEstratto) { finisciCoda(); return; }
  if (S.ritorno === "esplora") { tornaEsplora(); return; }
  if (S.ritorno === "guida") { vista("guida"); return; }
  vista("home");
};
$("menu").onchange = async () => {
  const voglio = $("menu").checked;
  $("menu").disabled = true;
  const r = await goMenu(voglio);
  $("menu").disabled = false;
  $("menu").checked = !!(r && r.on);
  $("menu-nota").hidden = !$("menu").checked;
  toast(r && r.ok ? (voglio ? t("menu_attivo") : t("menu_tolto")) : t("menu_errore"));
};
$("assoc").onchange = async () => {
  const voglio = $("assoc").checked;
  if (voglio && !(await conferma(t("assoc_conferma_tit"), t("assoc_conferma"), t("si")))) { $("assoc").checked = false; return; }
  $("assoc").disabled = true;
  const r = await goAssocia(voglio);
  $("assoc").disabled = false;
  $("assoc").checked = !!(r && r.on);
  toast(r && r.ok ? (voglio ? t("assoc_attivo") : t("assoc_tolto")) : t("assoc_errore"));
};
// niente "Indietro" del browser
history.pushState(null, "", location.href);
window.addEventListener("popstate", () => history.pushState(null, "", location.href));

// ---------- avvio ----------
const INIZIO = window.__TZ_INIZIO__ || { modo: "", percorsi: [] };
(async function avvio() {
  const a = await goAvvio();
  S.lingua = a.lingua; S.testi = a.testi; S.lingue = a.lingue; S.livello = a.livello || "massima";
  S.formato = a.formato === "7z" ? "7z" : "zip"; // qui solo .zip e .7z; tutti gli altri nella procedura guidata
  if (a.formati && a.formati.length) S.formati = a.formati;
  if (INIZIO.mini) document.body.classList.add("mini");
  const box = $("lingue");
  for (const l of S.lingue) {
    const b = document.createElement("button"); b.dataset.l = l; b.textContent = l.toUpperCase();
    b.onclick = async () => { if ((await goLingua(l)) === "ok") { S.lingua = l; applicaTesti(); } };
    box.append(b);
  }
  $("menu").checked = !!a.menu; $("menu-nota").hidden = !a.menu;
  $("assoc").checked = !!a.assoc;
  $("ver").textContent = "v" + String(a.versione).split(".").slice(0, 2).join(".");
  applicaTesti();
  const p = INIZIO.percorsi || [];
  const modi = ["comprimi", "estrai", "zip", "7z", "apri", "estrai-qui", "estrai-cartella", "estrai-in"];
  if (p.length) arrivati(p, modi.includes(INIZIO.modo) ? INIZIO.modo : "auto");
})();
